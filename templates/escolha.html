<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-image: url("/static/fundo.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;
        }

        .painel{
            background: rgba(238, 195, 195, 0.85);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.15);

            width: 550px;
        }

        h1{
            text-align: center;
            margin-bottom: 25px;
        }

        .container{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button{
            padding: 25px;
            border: none;
            border-radius: 12px;

            font-size: 16px;
            cursor: pointer;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 8px;

            transition: transform 0.2s;
        }

        button:hover{
            transform: scale(1.03);
        }

        .icone{
            font-size: 30px;
        }
    </style>
</head>

<body>
    

    <script>

    function navegar(url){

        const audio = new Audio("{{ url_for('static', filename='audio/clickk.mp3') }}");

        audio.volume = 1;

        audio.play();

        setTimeout(function(){

            window.location.href = url;

        },300);

    }

    </script>


    <div class="painel">

        <h1>📦 Controle de Estoque</h1>

        <div class="container">

            <button type="button" onclick="navegar('/cadastro')">
                <span class="icone" >📦</span>
                Cadastro de Produtos
            </button>

            <button type="button" onclick="navegar('/pesquisa_cat')">
                <span class="icone">🔎</span>
                Pesquisar Categoria
            </button>

            <button type="button" onclick="navegar('/pesquisa_pro')">
                <span class="icone">📋</span>
                Listar Produtos
            </button>

            <button type="button">
                <span class="icone">➕</span>
                Entrada de Estoque
            </button>

            <button type="button">
                <span class="icone">➖</span>
                Saída de Estoque
            </button>

            <button type="button">
                <span class="icone">📊</span>
                Relatórios
            </button>

        </div>

    </div>

</body>
</html>
