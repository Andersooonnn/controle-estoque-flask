<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatorio</title>

    <link rel="stylesheet" href="{{url_for('static',filename='bootstrap.css')}} ">
    
</head>
<style>
  body {
    background-image: url("/static/fundo.png");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    height: 100vh;
  }
</style>
<body>
    </div> 
    <a href="/escolha" class="botao">Voltar à Página Principal</a>         
    </div>
    <Button type="button" class="btn btn-primary" href="/escolha">
                Sair
    </Button>
    <div class="container" method="post"  action="/relatorio">
        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Categoria</th>
                    <th>Produto</th>
                    <th>Preco</th>
                    <th>Quantidade</th>    
                </tr>
            </thead>

            {% for organizar in listas%}
            <tr>
                <td>{{organizar.categoria}}</td>
                <td>{{organizar.produto}}</td>
                <td>{{organizar.preco}}</td>
                <td>{{organizar.quantidade}}</td>
            
            </tr>
            {% endfor %}
        
            </thead>
        </table>
    </div>
</body>
</html>
