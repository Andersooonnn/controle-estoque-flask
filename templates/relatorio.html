<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatorio</title>
    <style type="text/css">
        table, td, th{
            border: 1px solid #000000;
        }
    </style>
    
</head>
<body>
    <table>
        <tr>
            <th>categoria</th>
            <th>produto</th>
            <th>preco</th>
            <th>quantidade</th>    
        </tr>

        {% for organizar in listas%}
        <tr>
            <td>{{organizar.categoria}}</td>
            <td>{{organizar.produto}}</td>
            <td>{{organizar.preco}}</td>
            <td>{{organizar.quantidade}}</td>
           
        </tr>
        {% endfor %}

        
    </table>
    
</body>
</html>
