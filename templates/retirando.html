<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>controle</title>

   <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-image: url("/static/fundo.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;
        }

        .painel{
            background: rgba(238, 212, 212, 0.85);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.15);

            width: 550px;
        }

        h1{
            text-align: center;
            margin-bottom: 25px;
        }

        .container{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button{
            padding: 25px;
            border: none;
            border-radius: 12px;

            font-size: 16px;
            cursor: pointer;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 8px;

            transition: transform 0.2s;
        }

        button:hover{
            transform: scale(1.03);
        }

        .icone{
            font-size: 30px;
        }
    </style>

</head>
<body>
    
    <form method="post" action="/retirando">
        <div class="container" >
            <h1>➖  Retirar</h1>
            
            
            <tr>
                <th>categoria</th>
                <th>produto</th>
                <th>preco</th>
                <th>quantidade</th>    
            </tr>
        

            {% for organizar in listas%}
            <tr>
                <td>{{organizar.categoria}}</td>
                <td>{{organizar.produto}}</td>
                <td>{{organizar.preco}}</td>
                <td>{{organizar.quantidade}}</td>

            </tr>
            {% endfor %}
            
            <label>Quantidade a Retirar</label>
            <input type="number" name="numberquantidade">
            
            
            <button>Saida</button>  
            

            
        </div>
    <a href="/retirada" class="botao">voltar</a>         
    </form>
</body>
</html>
